name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Build executable
        run: pyinstaller --onefile --name randomdom randomdom.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-windows
          path: dist/randomdom.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Build executable
        run: pyinstaller --onefile --name randomdom randomdom.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-linux
          path: dist/randomdom

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Build executable
        run: pyinstaller --onefile --name randomdom randomdom.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-macos
          path: dist/randomdom

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build APK
        run: flutter build apk --release
        working-directory: flutter_app

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  create-release:
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-windows
          path: ./windows
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-linux
          path: ./linux
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-macos
          path: ./macos

      - name: Download Android artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-android
          path: ./android
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows/randomdom.exe
            ./linux/randomdom
            ./macos/randomdom
            ./android/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
