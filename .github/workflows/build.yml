name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Build executable
        run: pyinstaller --onefile --name randomdom randomdom.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-windows
          path: dist/randomdom.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Build executable
        run: pyinstaller --onefile --name randomdom randomdom.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-linux
          path: dist/randomdom

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyinstaller
      
      - name: Build executable
        run: pyinstaller --onefile --name randomdom randomdom.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: randomdom-macos
          path: dist/randomdom

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-windows
          path: ./windows
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-linux
          path: ./linux
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v3
        with:
          name: randomdom-macos
          path: ./macos
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows/randomdom.exe
            ./linux/randomdom
            ./macos/randomdom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
